<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1F"/>
      <stop offset="50%" stop-color="#0B1536"/>
      <stop offset="100%" stop-color="#050A18"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#3A86FF"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFBE0B"/>
      <stop offset="100%" stop-color="#FB5607"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#3A86FF" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Futuristic African Chevron / Pyramid / Alpha Circuit -->
  <g transform="translate(256, 256)">
    <!-- Outer energy orbit ring -->
    <circle r="170" fill="none" stroke="#1E293B" stroke-width="2"/>
    <circle r="170" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-dasharray="140 30 70 40 20 50" opacity="0.8"/>
    
    <!-- Geometric African Pattern background rays -->
    <path d="M 0 -195 L 0 -170" stroke="#00D2FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 195 0 L 170 0" stroke="#00D2FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0 195 L 0 170" stroke="#00D2FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M -195 0 L -170 0" stroke="#00D2FF" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Main Stylized 'A' Crest (African Innovation Symbol) -->
    <!-- Left Leg -->
    <path d="M -105 130 L -30 -115 C -20 -140 -5 -148 0 -148 C 5 -148 20 -140 30 -115 L 105 130 C 109 143 97 155 84 150 L 52 138 C 45 135 40 128 38 120 L 16 35 L -16 35 L -38 120 C -40 128 -45 135 -52 138 L -84 150 C -97 155 -109 143 -105 130 Z" 
          fill="url(#primaryGrad)" filter="url(#glow)"/>
          
    <!-- African Golden Diamond Core -->
    <polygon points="0,-60 48,0 0,60 -48,0" fill="url(#accentGrad)"/>
    
    <!-- Central Innovation Node -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="7" fill="#0B132B"/>
    
    <!-- Futuristic Crossbars / Cyber Connections -->
    <line x1="-90" y1="50" x2="-28" y2="50" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <line x1="28" y1="50" x2="90" y2="50" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Innovation Nodes -->
    <circle cx="-90" cy="50" r="5" fill="#00D2FF"/>
    <circle cx="90" cy="50" r="5" fill="#00D2FF"/>
    <circle cx="0" cy="-148" r="6" fill="#FFBE0B"/>
  </g>
</svg>
